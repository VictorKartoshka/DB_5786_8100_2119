<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE DINE - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <h1>LUXE DINE</h1>
        </div>
        <p class="login-tagline">Restaurant Management System</p>
        <div class="login-divider"></div>
        <form method="POST" action="{{ url_for('login') }}">
            {% if error %}
            <p style="color: red; margin-bottom: 15px; text-align: center;">{{ error }}</p>
            {% endif %}
            <input type="text" name="username" placeholder="Username" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ddd; background: rgba(255,255,255,0.9); font-size: 16px; box-sizing: border-box;">
            <input type="password" name="password" placeholder="Password" required style="width: 100%; padding: 10px; margin-bottom: 25px; border-radius: 5px; border: 1px solid #ddd; background: rgba(255,255,255,0.9); font-size: 16px; box-sizing: border-box;">
            <button type="submit" class="login-btn" style="width: 100%; border: none; cursor: pointer;">Enter System</button>
        </form>
    </div>
</div>
</body>
</html>
